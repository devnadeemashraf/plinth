services:
  - type: web
    name: plinth-api
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: MASTER_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: plinth-db
          property: connectionString

databases:
  - name: plinth-db
    plan: free
    databaseName: plinth
    user: plinth_user
