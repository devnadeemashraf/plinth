x-app: &app
  build: .
  image: plinth:local
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://plinth:plinth@postgres:5432/plinth

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_USER: plinth
      POSTGRES_PASSWORD: plinth
      POSTGRES_DB: plinth
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plinth -d plinth"]
      interval: 5s
      timeout: 3s
      retries: 10

  # `docker compose --profile app up -d --build` runs migrate once, then the api on port 3000.
  migrate:
    <<: *app
    profiles: [app]
    command: ["node", "src/main/migrate.ts"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    profiles: [app]
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
