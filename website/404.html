<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Plinth</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center;">
  <div class="container" style="max-width: 500px; padding: 2rem;">
    <div class="pill-badge" style="margin-bottom: 1.5rem;">
      <span class="pill-dot"></span>
      <span>HTTP 404</span>
    </div>
    <h1 style="font-size: 2.5rem; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 1rem;">Page not found</h1>
    <p style="color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.95rem; line-height: 1.6;">
      The page or documentation section you are looking for does not exist or has been moved.
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center;">
      <a href="index.html" class="btn btn-primary">Return Home</a>
      <a href="docs.html" class="btn btn-secondary">Open Docs &rarr;</a>
    </div>
  </div>
</body>
</html>
