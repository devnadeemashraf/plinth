# Policy: docs/HANDBOOK.md "Dependency updates". Cooldown matches pnpm's minimumReleaseAge (7 days).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: increase
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      vitest:
        patterns: ["vitest", "@vitest/*"]
      commitlint:
        patterns: ["@commitlint/*"]
      testcontainers:
        patterns: ["testcontainers", "@testcontainers/*"]
      stryker:
        patterns: ["@stryker-mutator/*"]
      drizzle:
        patterns: ["drizzle-orm", "drizzle-kit"]
      dev-minor-patch:
        dependency-type: development
        update-types: ["minor", "patch"]
      prod-patch:
        dependency-type: production
        update-types: ["patch"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
