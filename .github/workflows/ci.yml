name: Plinth CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm 12
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
          run_install: false

      - name: Get pnpm Store Directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm Store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: "Quality Gate 1: Biome Lint & Format Check"
        run: pnpm lint

      - name: Quality Gate 2: TypeScript 7.0 Typecheck
        run: pnpm typecheck

      - name: Quality Gate 3: Architectural Fitness Tests
        run: pnpm test:fitness

      - name: "Quality Gate 4: Vitest Full Suite & Coverage (>= 85%)"
        run: pnpm test:coverage
